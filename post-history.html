<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ประวัติโพสต์</title>
<link rel="stylesheet" href="dashboard-v2.css?v=6">
<link rel="stylesheet" href="post-history.css?v=1">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="spu"><span>SPU</span> |</div><div class="sub">SOCIAL<br>INTELLIGENCE</div></div>
  <nav class="nav">
    <a href="index.html"><span class="ico">▥</span>ภาพรวม</a>
    <a href="benchmark.html"><span class="ico">⇄</span>SPU Benchmark</a>
    <a href="institutions.html"><span class="ico">⌂</span>Insight รายสถาบัน</a>
    <a href="post-history.html" class="active"><span class="ico">↺</span>ประวัติโพสต์</a>
  </nav>
</aside>
<main class="main">
  <div class="topbar">
    <div><div class="eyebrow">POST HISTORY</div><h1>ประวัติโพสต์</h1></div>
    <div class="updated" id="historyStatus">กำลังโหลด...</div>
  </div>

  <div class="history-filters">
    <div class="filter"><label>มหาวิทยาลัย</label><select id="historyInstitution"></select></div>
    <div class="filter"><label>Platform</label><select id="historyPlatform"><option value="all">ทั้งหมด</option><option value="facebook">Facebook</option><option value="instagram">Instagram</option></select></div>
    <div class="filter history-search"><label>ค้นหา Post</label><input id="historySearch" type="search" placeholder="ค้นหา Caption หรือ URL"></div>
    <div class="filter"><label>เรียงลำดับ</label><select id="historySort"><option value="published_desc">โพสต์ล่าสุด</option><option value="collected_desc">ดึงล่าสุด</option><option value="likes_desc">Likes สูงสุด</option></select></div>
  </div>

  <div class="history-summary" id="historySummary">กำลังโหลดข้อมูล...</div>
  <section class="history-grid" id="historyGrid"></section>
  <div class="history-empty" id="historyEmpty" hidden>ไม่พบ Post ตามตัวกรองที่เลือก</div>
</main>
</div>

<div class="history-modal" id="historyModal" aria-hidden="true">
  <div class="history-modal-panel" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle">
    <button class="history-close" id="historyClose" type="button" aria-label="ปิด">×</button>
    <div id="historyDetail"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="config.js?v=20260915-3"></script>
<script src="post-history.js?v=1"></script>
</body>
</html>
